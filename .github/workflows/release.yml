name: Release

# Accepted versions: v1.0.0, v1.0.0-RC1, 1.0.0, 1.0.0-RC1 (RC is case-insensitive).
# Push a tag, or run manually with the version. A "-RC<n>" suffix publishes a pre-release.
on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v1.0.0, 1.0.0-RC1"
        required: true

permissions:
  contents: write

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if ! [[ "$RAW" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[Rr][Cc][0-9]+)?)$ ]]; then
            echo "::error::Invalid version '$RAW' (expected v1.0.0, v1.0.0-RC1, 1.0.0 or 1.0.0-RC1)"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "tag=$RAW" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "${BASH_REMATCH[2]}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/AppleRemote.Tests -c Release

  # The three builds below run in parallel (with the tests); `release` assembles them.
  build-app:
    name: App (${{ matrix.rid }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # AppleRemoteDriver=false: the kernel filter is built by its own job.
      - run: >
          dotnet publish src/AppleRemote.App -c Release -r ${{ matrix.rid }}
          --self-contained false -p:PublishSingleFile=true -p:AppleRemoteDriver=false
          -p:Version=${{ needs.version.outputs.version }} -o out
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: out/

  build-installer:
    name: Driver installer (${{ matrix.rid }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: >
          dotnet publish src/AppleRemote.DriverInstaller -c Release -r ${{ matrix.rid }}
          --self-contained false -p:Version=${{ needs.version.outputs.version }} -o out
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.rid }}
          path: out/

  # Kernel filter (Rust, windows-drivers-rs), x64 only. Signed with the test certificate generated by cargo-make.
  build-driver:
    name: Driver (win-x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-make.exe
            src/AppleRemoteDriver/target
          key: driver-${{ hashFiles('src/AppleRemoteDriver/Cargo.lock') }}
      - name: Install toolchain (WDK, LLVM, cargo-make)
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsSDK.10.0.26100 --exact --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
          winget install --id Microsoft.WindowsWDK.10.0.26100 --exact --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
          choco install llvm -y --no-progress
          if (-not (Get-Command cargo-make -ErrorAction SilentlyContinue)) { cargo install --locked cargo-make }
      - name: Point Makefile.toml at the CI cargo registry
        working-directory: src/AppleRemoteDriver
        shell: bash
        run: |
          cargo fetch --locked
          mk=$(ls -d "$HOME"/.cargo/registry/src/*/wdk-build-0.3.0)/rust-driver-makefile.toml
          sed -i "s|^extend = .*|extend = [{ path = \"$mk\" }]|" Makefile.toml
      - name: Build and sign
        working-directory: src/AppleRemoteDriver
        run: cargo make --profile release
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
      - uses: actions/upload-artifact@v4
        with:
          name: driver-win-x64
          path: |
            src/AppleRemoteDriver/target/release/AppleRemoteDriver_package/AppleRemoteDriver.sys
            src/AppleRemoteDriver/target/release/AppleRemoteDriver_package/AppleRemoteDriver.inf
            src/AppleRemoteDriver/target/release/AppleRemoteDriver_package/appleremotedriver.cat
            src/AppleRemoteDriver/target/release/AppleRemoteDriver_package/WDRLocalTestCert.cer
          if-no-files-found: error

  # Inno Setup installer (preinstalled on windows-latest) wrapping the same layout as the zips.
  build-setup:
    name: Setup (${{ matrix.rid }})
    needs: [version, build-app, build-installer, build-driver]
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64, arch: x64 }
          - { rid: win-arm64, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Assemble layout and compile
        shell: bash
        run: |
          mkdir stage
          cp -r app-${{ matrix.rid }}/. stage
          cp -rn installer-${{ matrix.rid }}/. stage
          if [ "${{ matrix.arch }}" = x64 ]; then mkdir stage/driver; cp driver-win-x64/* stage/driver; fi
          iscc //DAppVersion=${{ needs.version.outputs.version }} //DSourceDir="$PWD/stage" //DArch=${{ matrix.arch }} installer/AppleRemote.iss
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.rid }}
          path: Output/*.exe
          if-no-files-found: error

  release:
    needs: [version, test, build-app, build-installer, build-driver, build-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Assemble zips
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for rid in win-x64 win-arm64; do
            d="AppleRemote-$VERSION-$rid"
            mkdir "$d"
            cp -r app-$rid/. "$d"
            cp -rn installer-$rid/. "$d"   # no clobber: the app's own copy wins
            if [ "$rid" = win-x64 ]; then mkdir "$d/driver"; cp driver-win-x64/* "$d/driver"; fi
            (cd "$d" && zip -qr "../$d.zip" .)
          done
      - name: Collect setups
        run: cp setup-*/*.exe .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=""
          [ "$PRERELEASE" = true ] && flags="--prerelease"
          gh release create "$TAG" *.zip *.exe --title "$TAG" --generate-notes --target "$GITHUB_SHA" $flags
